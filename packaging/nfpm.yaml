# Cross-distro packaging for DeepCoolGo (https://nfpm.goreleaser.com).
#
#   make pkgroot          # stage the install tree into build/pkgroot
#   make rpm  /  make deb  # -> build/deepcoolgo_<ver>_<arch>.{rpm,deb}
#
# ${VERSION} and ${GOARCH} are filled in by the Makefile targets.

name: deepcoolgo
arch: ${GOARCH}
platform: linux
version: ${VERSION}
release: 1
section: utils
priority: optional
maintainer: 3x3cutable <avbazarov2006@mail.ru>
homepage: https://example.com/deepcoolgo
license: MIT
description: |
  Live CPU telemetry on DeepCool LCD coolers.
  Reads CPU load, temperature, clock and power from the kernel and renders a
  320x240 frame to the cooler's LCD over USB, using pluggable Go-plugin themes.

depends:
  - libusb-1.0-0
overrides:
  rpm:
    depends:
      - libusbx

contents:
  - src: ./build/pkgroot/usr/bin/deepcoolgo
    dst: /usr/bin/deepcoolgo
  - src: ./build/pkgroot/usr/lib/deepcoolgo/themes/*.so
    dst: /usr/lib/deepcoolgo/themes/
  - src: ./build/pkgroot/usr/lib/systemd/system/deepcoolgo.service
    dst: /usr/lib/systemd/system/deepcoolgo.service
  - src: ./build/pkgroot/etc/deepcoolgo/DCGO/config.yml
    dst: /etc/deepcoolgo/DCGO/config.yml
    type: "config|noreplace"
  - src: ./LICENSE
    dst: /usr/share/doc/deepcoolgo/LICENSE
  - src: ./README.md
    dst: /usr/share/doc/deepcoolgo/README.md

scripts:
  postinstall: ./packaging/scripts/postinstall.sh
  preremove: ./packaging/scripts/preremove.sh
  postremove: ./packaging/scripts/postremove.sh
